name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, secret scan, audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Expo doctor
        run: npx expo-doctor

      # The bundle is built WITH a key in the environment, then scanned.
      #
      # Building without one makes this gate vacuous: an export that never had
      # a key cannot leak one, so the scan passes whether the code is right or
      # wrong. The canary below is a real value for the scanner's identity
      # check to match on, so the step fails the day someone renames the
      # variable to EXPO_PUBLIC_ANTHROPIC_KEY and Metro starts inlining it.
      #
      # It is not a credential: it is a fixed string that has never been an
      # Anthropic key. The real key lives only in the EAS server environment.
      - name: Build web bundle
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
          ANTHROPIC_API_KEY: sk-ant-ci-canary-not-a-real-key-0000000000

      - name: Scan bundle for secrets
        run: npm run scan:secrets

      # Runs here rather than in its own job: a separate job pays for a second
      # `npm ci`, which is most of the runtime, and it blew a 10-minute budget
      # doing nothing but reinstalling what this job already has.
      - name: Audit (high and critical only)
        run: npm audit --audit-level=high
